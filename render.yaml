services:
  - type: web
    name: chefs-lab-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HF_API_URL
        value: https://api-inference.huggingface.co/models/Qwen/Qwen2.5-7B-Instruct
